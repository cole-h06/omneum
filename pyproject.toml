[build-system]
requires = [
    "maturin==1.15.0",
]
build-backend = "maturin"

[project]
name = "omneum"
version = "1.1.3"
description = "An open-source context evaluator for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "omneum/mcp/LICENSE", "omneum/NATIVE-LICENSES.txt", "omneum/RUST-STDLIB-LICENSES.txt"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # Upstream MCP 1.30.0 is bundled as omneum.mcp; see docs/mcp-sdk.md.
    "anyio>=4.5",
    "httpx>=0.27.1,<1",
    "httpx-sse>=0.4",
    "jsonschema>=4.20.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=1.6.1",
    "typing-extensions>=4.9.0",
    "typing-inspection>=0.4.1",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
    "pywin32>=311; sys_platform == 'win32'",
    "packaging>=25",
    "pydantic>=2.11,<3; python_version < '3.14'",
    "pydantic>=2.12,<3; python_version >= '3.14'",
    "typer>=0.16",
    "pydantic-settings>=2.14,<2.15",
    "idna>=3.10",
    "rfc3986>=2.0.0",
    "orjson>=3.10",
    "rfc8785==0.1.4",
    "platformdirs>=4,<5",
    "PyJWT>=2.15.0,<3",
    "starlette>=1.6.0",
]

[project.optional-dependencies]
oauth = ["PyJWT[crypto]>=2.15.0,<3", "cryptography>=50.0.1"]
mcp-ws = ["websockets>=15.0.1"]

[project.scripts]
omneum = "omneum.cli:app"
omneum-server = "omneum.proxy:main"
omneum-contributor = "omneum.contributor:main"

[project.urls]
Repository = "https://github.com/cole-h06/omneum"
Issues = "https://github.com/cole-h06/omneum/issues"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.161,<7", "maturin>=1,<2", "psycopg[binary]==3.3.6"]
auth-test = ["cryptography>=50.0.1"]
benchmarks = [
    "sentence-transformers>=5,<6",
    "pillow>=12.3,<13",
    "numpy>=2,<3",
    "anthropic>=0.64,<1",
    "openai",
    "google-genai",
    "cohere",
    "python-dotenv>=1",
    "pytest>=8",
]
google-adk = ["google-adk>=1,<2"]
langgraph = ["langgraph>=1,<2"]
openai-agents = ["openai-agents>=0.13,<1"]
llamaindex = ["llama-index>=0.13,<1"]
microsoft = ["agent-framework>=1,<2"]
crewai = ["crewai>=1.15,<2; python_version < '3.14'"]

[tool.uv]
required-version = "==0.12.10"
default-groups = ["dev"]
exclude-newer = "7 days"
# Security override for optional frameworks that cap MCP below patched 1.30.0.
override-dependencies = ["mcp==1.30.0"]
# These independent framework examples require incompatible OpenTelemetry ranges.
# Resolve them separately instead of downgrading ADK and its security dependencies.
conflicts = [[{ group = "google-adk" }, { group = "crewai" }]]
# Isolated PEP 517 builds are resolved separately from uv.lock.
build-constraint-dependencies = ["maturin==1.15.0"]

[tool.uv.dependency-groups]
crewai = { requires-python = ">=3.11,<3.14" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
exclude = ["evaluate.py", "**/*.zip", "tools/provenance_explorer/**", "docs/reviews/**", "deploy/network/vm/production-audit.py", "src/__fuzz__/**", "**/*.pem", "**/*.key", ".env", ".env.*"]
include = [
    { path = "omneum/NATIVE-LICENSES.txt", format = ["sdist", "wheel"] },
    { path = "omneum/RUST-STDLIB-LICENSES.txt", format = ["sdist", "wheel"] },
    { path = "omneum/algorithm_compatibility.json", format = ["sdist", "wheel"] },
    { path = "omneum/schemas/research-event-v1.schema.json", format = ["sdist", "wheel"] },
    { path = "omneum/mcp/LICENSE", format = ["sdist", "wheel"] },
    { path = "omneum/mcp/UPSTREAM.json", format = ["sdist", "wheel"] },
    { path = "omneum/mcp/UPSTREAM-PYPROJECT.toml", format = ["sdist", "wheel"] },
    { path = "omneum/mcp/py.typed", format = ["sdist", "wheel"] },
]
module-name = "omneum_oprf"
python-packages = ["omneum"]
locked = true
