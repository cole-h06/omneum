[build-system]
requires = [
    "maturin>=1,<2",
]
build-backend = "maturin"

[project]
name = "omneum"
version = "1.0.2"
description = "A data trust gateway for agentic systems."
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.11,<3",
    "typer>=0.16",
    "pydantic-settings>=2.14,<2.15",
    "idna>=3.10",
    "rfc3986>=2.0.0",
    "orjson>=3.10",
    "rfc8785==0.1.4",
    "platformdirs>=4,<5",
]

[project.scripts]
omneum = "omneum.cli:app"
omneum-server = "omneum.server:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.161,<7", "maturin>=1,<2"]
benchmarks = [
    "sentence-transformers>=5,<6",
    "numpy>=2,<3",
    "anthropic>=0.64,<1",
    "openai",
    "google-genai",
    "cohere",
    "python-dotenv>=1",
    "pytest>=8",
]
langgraph = ["langgraph>=1,<2"]
openai-agents = ["openai-agents>=0.13,<1"]
llamaindex = ["llama-index>=0.13,<1"]
microsoft = ["agent-framework>=1,<2"]
crewai = ["crewai>=1.15,<2; python_version < '3.14'"]

[tool.uv]
required-version = "==0.12.10"
default-groups = ["dev"]
exclude-newer = "7 days"
# Isolated PEP 517 builds are resolved separately from uv.lock.
build-constraint-dependencies = ["maturin==1.15.0"]

[tool.uv.dependency-groups]
crewai = { requires-python = ">=3.11,<3.14" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
module-name = "omneum_oprf"
python-packages = ["omneum"]
locked = true
