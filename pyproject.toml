[build-system]
requires = [
    "maturin>=1,<2",
]
build-backend = "maturin"

[project]
name = "omneum"
version = "1.0.0"
description = "A data trust gateway for agentic systems."
requires-python = ">=3.11"

dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic-settings>=2.14,<2.15",
    "idna>=3.10",
    "rfc3986>=2.0.0",
    "orjson>=3.10",
    "rfc8785==0.1.4",
    "platformdirs>=4,<5",
]

[project.scripts]
omneum = "omneum.cli:app"
omneum-server = "omneum.server:main"

[tool.maturin]
module-name = "omneum_oprf"
python-packages = ["omneum"]