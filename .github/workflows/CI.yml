name: Recover original Omneum v1.0.3 PyPI publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-pypi:
    name: Publish only missing original v1.0.3 files
    if: github.repository == 'cole-h06/omneum' && github.ref == 'refs/heads/v1.0.3-pypi-recovery-20261012'
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/omneum/1.0.3/
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: pypi-release-refs/tags/v1.0.3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Authenticate original run and select only missing verified artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/recover_pypi_103.py prepare
      - name: Recheck that no staged file exists on PyPI
        if: steps.prepare.outputs.needed == 'true'
        run: python .github/recover_pypi_103.py pre-upload
      - name: Publish only missing original files with verbose diagnostics
        if: steps.prepare.outputs.needed == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: missing-distributions/
          verify-metadata: true
          skip-existing: false
          verbose: true
          print-hash: true
          attestations: true
      - name: Verify all 17 public distribution bytes and unchanged tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/recover_pypi_103.py verify-final
      - name: Retain before and after publication evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: original-v1.0.3-pypi-recovery-evidence
          path: |
            before-publication.json
            after-publication.json
          if-no-files-found: warn
