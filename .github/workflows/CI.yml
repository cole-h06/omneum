name: Build wheels

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check lockfile and install development environment
        run: |
          uv lock --check
          uv sync --locked
      - name: Test Python and native extension
        run: uv run --locked pytest
      - name: Test Rust
        run: |
          cargo test --locked
          cargo test --locked --no-default-features --features daemon
          cargo build --locked --no-default-features --features daemon --bin omneumd
          sudo python3 tests/security/linux_isolation.py target/debug/omneumd
          uv pip check
      - name: Verify Linux installation
        run: sudo .venv/bin/python tests/security/linux_install.py target/debug/omneumd
      - name: Check production environment
        run: |
          uv sync --locked --no-default-groups
          uv run --locked --no-default-groups python -c "import omneum, omneum.server, omneum_oprf"

      - name: Verify managed Linux runtime
        run: |
          cargo build --locked --release --no-default-features --features daemon --bins
          sudo mkdir -p /opt/omneum/target/release
          tar -cf - Cargo.toml Cargo.lock build.rs src tests omneum pyproject.toml uv.lock README.md deploy | sudo tar -C /opt/omneum -xf -
          sudo chown root:root /opt
          sudo chmod 755 /opt
          sudo cp target/release/omneum-server /opt/omneum/target/release/
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" UV_PYTHON_INSTALL_DIR=/opt/omneum/python "$(command -v uv)" sync --project /opt/omneum --locked --no-default-groups --no-editable --managed-python --python ${{ matrix.python }}
          sudo chown -R root:root /opt/omneum
          sudo find /opt/omneum -type d -exec chmod a+rX,go-w {} +
          sudo find /opt/omneum -type f -exec chmod a+rX,go-w {} +
          # Root-run imports must not create writable bytecode caches after hardening.
          sudo /opt/omneum/.venv/bin/python -B /opt/omneum/tests/security/linux_runtime.py
          sudo /opt/omneum/.venv/bin/python -B /opt/omneum/tests/security/linux_adversarial.py

  build:
    needs: test
    if: github.event_name != 'pull_request'
    name: Build ${{ matrix.platform.os }} ${{ matrix.platform.target }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: macos
            runner: macos-15
            target: aarch64

          - os: macos
            runner: macos-15-intel
            target: x86_64

          - os: linux
            runner: ubuntu-22.04
            target: x86_64

          - os: windows
            runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --interpreter python${{ matrix.python }}
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}-py${{ matrix.python }}
          path: dist/*.whl
