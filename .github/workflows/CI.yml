name: Publish verified Omneum v1.0.4 artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_TAG: v1.0.4
  CANDIDATE_SHA: 978bc5806a13bcdbcd40e0f5b6d0b284935c6517
  ACCEPTED_RUN: '38317382168'
concurrency:
  group: publish-original-v1.0.4
  cancel-in-progress: false
jobs:
  publish-github:
    if: github.repository == 'cole-h06/omneum' && github.ref == 'refs/heads/v1.0.4-publication'
    runs-on: ubuntu-22.04
    environment: github-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 978bc5806a13bcdbcd40e0f5b6d0b284935c6517
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Download exact accepted distributions, assets and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name python-release-wheels --dir pypi-dist
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name daemon-release-assets --dir release-assets
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name release-manifest --dir approved-manifest
          python tools/verify_promoted_release.py
          python candidate/tools/release_wheels.py verify --tag "$RELEASE_TAG" --project candidate/pyproject.toml --wheels pypi-dist --daemon-assets release-assets
          python candidate/tools/release_sdist.py --sdist pypi-dist/omneum-1.0.4.tar.gz --version 1.0.4
          python candidate/tools/release_publication.py check-new --version 1.0.4
      - name: Create exact annotated tag and publish verified daemon assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN avoids a recursive tag-build run; all 44 acceptance gates above already passed.
          python - <<'PY'
          import json, subprocess
          def api(*args):
              return json.loads(subprocess.check_output(['gh', 'api', *args]))
          repo='repos/cole-h06/omneum'
          tag=api('--method','POST',repo+'/git/tags','-f','tag=v1.0.4','-f','message=Omneum v1.0.4; verified original artifacts from run 38317382168','-f','object=978bc5806a13bcdbcd40e0f5b6d0b284935c6517','-f','type=commit')
          api('--method','POST',repo+'/git/refs','-f','ref=refs/tags/v1.0.4','-f','sha='+tag['sha'])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')" = public
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title 'Omneum v1.0.4' --notes 'Complete distribution coverage patch. Original verified artifacts from candidate 978bc580 and CI run 38317382168; no rebuild.' release-assets/*
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir uploaded-assets
          python tools/verify_promoted_release.py uploaded-assets
          diff -r release-assets uploaded-assets
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify anonymous downloads before any package publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir public-release-assets
          for file in release-assets/*; do
            name=$(basename "$file")
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 600 --proto '=https' --proto-redir '=https' "https://github.com/cole-h06/omneum/releases/download/$RELEASE_TAG/$name" --output "public-release-assets/$name"
          done
          python tools/verify_promoted_release.py public-release-assets
          diff -r release-assets public-release-assets
  publish-pypi:
    needs: publish-github
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 978bc5806a13bcdbcd40e0f5b6d0b284935c6517
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Reverify original bytes and public daemon availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name python-release-wheels --dir pypi-dist
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name release-manifest --dir approved-manifest
          mkdir release-assets
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          m=json.load(open('approved-manifest/release-manifest.json'))
          for name in m['daemon_assets']:
              with urllib.request.urlopen('https://github.com/cole-h06/omneum/releases/download/v1.0.4/'+name,timeout=600) as r:
                  Path('release-assets',name).write_bytes(r.read())
          PY
          python tools/verify_promoted_release.py
          python candidate/tools/release_wheels.py verify --tag "$RELEASE_TAG" --project candidate/pyproject.toml --wheels pypi-dist --daemon-assets release-assets
          python candidate/tools/release_sdist.py --sdist pypi-dist/omneum-1.0.4.tar.gz --version 1.0.4
          python candidate/tools/release_publication.py check-new --version 1.0.4
      - name: Upload all 17 original files using existing Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: pypi-dist/
          skip-existing: false
          verbose: true
      - name: Verify complete public index and all downloaded package hashes
        run: python candidate/tools/release_publication.py verify-public --version 1.0.4 --manifest approved-manifest/release-manifest.json
  fresh-public-arm314:
    needs: publish-pypi
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 978bc5806a13bcdbcd40e0f5b6d0b284935c6517
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Fresh native Apple Silicon installation from public PyPI
        env:
          OMNEUM_ACCEPTANCE_REPORT: ${{ runner.temp }}/public-arm314-acceptance.json
        run: |
          unset PYTHONPATH PIP_FIND_LINKS PIP_EXTRA_INDEX_URL PIP_NO_INDEX
          export PIP_CONFIG_FILE=/dev/null
          export PIP_INDEX_URL=https://pypi.org/simple
          python -m pip install --only-binary=:all: uv==0.12.10
          uv venv --managed-python --python 3.14 --seed "$RUNNER_TEMP/fresh-public"
          "$RUNNER_TEMP/fresh-public/bin/python" -c 'import platform; assert platform.machine() == "arm64"'
          "$RUNNER_TEMP/fresh-public/bin/python" -m pip install --no-cache-dir --only-binary=:all: --report "$RUNNER_TEMP/pip-public-install.json" omneum==1.0.4
          "$RUNNER_TEMP/fresh-public/bin/python" -m pip check
          "$RUNNER_TEMP/fresh-public/bin/python" -I tools/check_release_dependencies.py
          python - <<'PY'
          from pathlib import Path
          import os
          source=Path('tests/security/public_release_install.py').read_text()
          old='\n'.join(["        with patch.object(installation, 'download', download):", "            result = CliRunner().invoke(get_command(app), ['install'])", "        print(result.output, end='')", "        assert result.exit_code == 0, result.exception", "        assert 'Omneum is ready.' in result.output"])
          new='\n'.join(["        result = subprocess.run([str(Path(sys.executable).parent / 'omneum'), 'install'], check=True, text=True, capture_output=True)", "        print(result.stdout, end='')", "        assert 'Omneum is ready.' in result.stdout"])
          assert source.count(old)==1
          Path(os.environ['RUNNER_TEMP'],'public_install_probe.py').write_text(source.replace(old,new))
          PY
          "$RUNNER_TEMP/fresh-public/bin/python" -I "$RUNNER_TEMP/public_install_probe.py" public
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.load(open(Path(os.environ['RUNNER_TEMP'],'pip-public-install.json')))
          omneum=next(i for i in x['install'] if i['metadata']['name']=='omneum')
          assert omneum['metadata']['version']=='1.0.4' and not omneum['is_direct']
          assert omneum['download_info']['url'].startswith('https://files.pythonhosted.org/')
          assert omneum['download_info']['archive_info']['hashes']['sha256']=='5b11876d37c7148e77be75ea513d238fe7e7337dba1fb69df2d4183344ca2e4f'
          print('PASS: public native ARM64 CPython 3.14 package hash equals approved manifest')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-arm314-install-evidence
          path: |
            ${{ runner.temp }}/public-arm314-acceptance.json
            ${{ runner.temp }}/pip-public-install.json
          if-no-files-found: warn
