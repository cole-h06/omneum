name: Verify recovered original Omneum v1.0.3 PyPI files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovered:
    name: Verify ${{ matrix.filename }}
    if: github.repository == 'cole-h06/omneum' && github.ref == 'refs/heads/v1.0.3-pypi-recovery-20261012'
    strategy:
      fail-fast: false
      matrix:
        filename:
          - omneum-1.0.3-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          - omneum-1.0.3-cp314-cp314-win_amd64.whl
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Verify all public file hashes, recovered target and original release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_FILENAME: ${{ matrix.filename }}
        run: python .github/recover_pypi_103.py verify-file "$RECOVERY_FILENAME"
      - name: Retain public verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-original-v1.0.3-${{ matrix.filename }}
          path: after-publication.json
          if-no-files-found: warn
