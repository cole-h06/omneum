name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-15
            target: aarch64
            python: "3.13"

          - os: macos
            runner: macos-15-intel
            target: x86_64
            python: "3.13"

          - os: linux
            runner: ubuntu-22.04
            target: x86_64
            python: "3.13"

          - os: windows
            runner: windows-latest
            target: x64
            python: "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
