name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.os }} ${{ matrix.platform.target }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: macos
            runner: macos-15
            target: aarch64

          - os: macos
            runner: macos-15-intel
            target: x86_64

          - os: linux
            runner: ubuntu-22.04
            target: x86_64

          - os: windows
            runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python${{ matrix.python }}
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}-py${{ matrix.python }}
          path: dist/*.whl
