name: Build wheels

on:
  pull_request:
  workflow_dispatch:
    inputs:
      installers_only:
        description: Run unpublished installer diagnostics only; never satisfies publication gates
        type: boolean
        default: false
  push:
    tags:
      - "v*"

env:
  RUSTFLAGS: --remap-path-prefix=/home/runner=/build/runner --remap-path-prefix=/Users/runner=/build/runner --remap-path-prefix=/io=/build/omneum --remap-path-prefix=C:\Users=/build/user --remap-path-prefix=D:\a=/build/omneum

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.installers_only }}
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    env:
      ALGORITHM_SPEC_CHECKOUT: ${{ github.workspace }}/.algorithm-spec
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check wheel and daemon release contracts
        run: python -m unittest discover -s tools -p 'test_release_*.py' -v
      - name: Validate release tag against Python package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_daemon.py validate --tag "$RELEASE_TAG"
      - name: Check lockfile and install development environment
        run: |
          uv lock --check
          uv sync --locked
      - name: Read exact algorithm compatibility pin
        id: algorithm
        run: |
          uv run --locked python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse
          from omneum.compatibility import load_pin
          pin = load_pin()
          location = urlparse(pin["specification_repository"])
          repository = location.path.removeprefix("/").removesuffix(".git")
          if location.scheme != "https" or location.netloc != "github.com" or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("unsupported specification repository")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"repository={repository}\nrevision={pin['git_revision']}\n")
          PY
      - name: Checkout pinned specification commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.algorithm.outputs.repository }}
          ref: ${{ steps.algorithm.outputs.revision }}
          path: .algorithm-spec
          persist-credentials: false
      - name: Enforce independent algorithm conformance
        run: uv run --locked python -m omneum.conformance --spec-checkout "$ALGORITHM_SPEC_CHECKOUT"
      - name: Test Python and native extension
        # These example tests import LangGraph during collection. Keep that
        # framework and the development-only PostgreSQL driver out of public deps.
        run: uv run --locked --group langgraph pytest
      - name: Test Rust
        run: |
          cargo test --locked
          cargo test --locked --no-default-features --features daemon
          cargo build --locked --no-default-features --features daemon --bin omneumd
          sudo python3 tests/security/linux_isolation.py target/debug/omneumd
          uv pip check
      - name: Verify Linux installation
        run: sudo .venv/bin/python tests/security/linux_install.py target/debug/omneumd
      - name: Check production environment
        run: |
          uv sync --locked --no-default-groups
          uv run --locked --no-default-groups python -c "import omneum, omneum.server, omneum_oprf"

      - name: Verify managed Linux runtime
        run: |
          cargo build --locked --release --no-default-features --features daemon --bins
          sudo mkdir -p /opt/omneum/target/release
          tar -cf - Cargo.toml Cargo.lock build.rs src tests omneum pyproject.toml uv.lock README.md deploy | sudo tar -C /opt/omneum -xf -
          # The hosted image makes these directories writable for tool installation.
          # Establish production installation parents only on this disposable runner.
          test ! -L /opt
          test ! -L /usr/local/bin
          sudo chown root:root /opt /usr/local/bin
          sudo chmod 755 /opt /usr/local/bin
          sudo cp target/release/omneum-server /opt/omneum/target/release/
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" UV_PYTHON_INSTALL_DIR=/opt/omneum/python "$(command -v uv)" sync --project /opt/omneum --locked --no-default-groups --no-editable --managed-python --python ${{ matrix.python }}
          sudo chown -R root:root /opt/omneum
          sudo find /opt/omneum -type d -exec chmod a+rX,go-w {} +
          sudo find /opt/omneum -type f -exec chmod a+rX,go-w {} +
          # Root-run imports must not create writable bytecode caches after hardening.
          sudo /opt/omneum/.venv/bin/python -B /opt/omneum/tests/security/linux_runtime.py
          sudo /opt/omneum/.venv/bin/python -B /opt/omneum/tests/security/linux_adversarial.py

  linux-foreground:
    if: ${{ !inputs.installers_only }}
    name: Verify Linux foreground installation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - name: Install development environment
        run: uv sync --locked

      - name: Build native extension
        run: uv run maturin develop --locked

      - name: Build daemon
        run: cargo build --locked --release --no-default-features --features daemon --bin omneumd

      - name: Verify foreground installation
        run: sudo .venv/bin/python tests/security/linux_foreground.py target/release/omneumd

  build:
    needs: test
    if: github.event_name != 'pull_request'
    name: Build ${{ matrix.platform.os }} ${{ matrix.platform.target }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: macos
            runner: macos-15
            target: aarch64

          - os: macos
            runner: macos-15-intel
            target: x86_64

          - os: linux
            runner: ubuntu-22.04
            target: x86_64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --interpreter python${{ matrix.python }}
          manylinux: auto

      - name: Normalize SBOM paths and smoke-test built wheel outside checkout
        run: |
          python tools/release_wheels.py sanitize --wheels dist
          python tools/release_wheels.py smoke --wheels dist

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  windows-sdk:
    name: Build windows x64 Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' && !inputs.installers_only
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build with the selected Windows interpreter
        run: |
          python -m pip install maturin==1.15.0
          python -m maturin build --locked --release --out dist --interpreter python
          python tools/release_wheels.py sanitize --wheels dist
          python tools/release_wheels.py smoke --wheels dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-windows-x64-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    if: ${{ !inputs.installers_only }}
    name: Build and verify source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install maturin==1.15.0
      - name: Build source distribution
        run: |
          maturin sdist --out source-dist
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python tools/release_sdist.py --sdist "source-dist/omneum-$version.tar.gz" --version "$version"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-source-distribution
          path: source-dist/*.tar.gz
          if-no-files-found: error

  macos-install:
    if: ${{ !inputs.installers_only }}
    name: Verify macOS installation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "51c6170e8e3a01cef9f33b94f582b7b81ac65046f55d40afb35f9cff5a68c179"
          python-version: "3.14"
          enable-cache: false

      - name: Install development environment
        run: |
          uv lock --check
          uv sync --locked

      - name: Build daemon
        run: cargo build --locked --release --no-default-features --features daemon --bin omneumd

      - name: Test protected macOS installation parents
        run: python -m unittest discover -s tools -p 'test_macos_install_boundary.py' -v

      - name: Verify macOS installation
        run: sudo .venv/bin/python tests/security/macos_install.py target/release/omneumd "$(id -u)"

  daemon-artifacts:
    # Build diagnostics independently; prepare-daemon-release still gates all
    # publication on the complete test matrix and exact-artifact acceptance.
    if: github.event_name != 'pull_request'
    name: Build daemon ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      matrix:
        platform:
          - os: macos
            runner: macos-15
            target: aarch64
            binary: target/release/omneumd

          - os: macos
            runner: macos-15-intel
            target: x86_64
            binary: target/release/omneumd

          - os: linux
            runner: ubuntu-22.04
            target: x86_64
            binary: target/release/omneumd

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Build daemon
        run: cargo build --locked --release --no-default-features --features daemon --bin omneumd

      - name: Require protected evaluator build
        shell: bash
        run: test "$(target/release/omneumd capabilities)" = protected-voprf-v1

      - name: Stage macOS artifact
        if: matrix.platform.os == 'macos'
        run: |
          mkdir -p daemon-artifact/launchd
          cp "${{ matrix.platform.binary }}" daemon-artifact/omneumd
          cp deploy/install-macos.sh daemon-artifact/
          cp deploy/launchd/ai.omneum.omneumd.plist daemon-artifact/launchd/

      - name: Stage Linux artifact
        if: matrix.platform.os == 'linux'
        run: |
          mkdir -p daemon-artifact/systemd daemon-artifact/sysusers.d
          cp "${{ matrix.platform.binary }}" daemon-artifact/omneumd
          cp deploy/install.sh daemon-artifact/
          cp deploy/install-foreground.sh daemon-artifact/
          cp deploy/systemd/omneumd.service daemon-artifact/systemd/
          cp deploy/sysusers.d/omneum.conf daemon-artifact/sysusers.d/

      - name: Set up runtime builder
        if: matrix.platform.os == 'linux'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          enable-cache: false

      - name: Stage Linux managed server and offline runtime
        if: matrix.platform.os == 'linux'
        run: |
          cargo build --locked --release --no-default-features --features daemon --bin omneum-server
          cp target/release/omneum-server daemon-artifact/
          cp deploy/install-server.sh deploy/install_server.py deploy/install-linux.py daemon-artifact/
          cp omneum/runtime_bundle.py daemon-artifact/
          cp deploy/systemd/omneum-server.socket deploy/systemd/omneum-server@.service daemon-artifact/systemd/
          cp deploy/sysusers.d/omneum-server.conf daemon-artifact/sysusers.d/
          # Build at the same fixed prefix used by the existing service definition.
          sudo mkdir /opt/omneum
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" UV_PROJECT_ENVIRONMENT=/opt/omneum/.venv UV_PYTHON_INSTALL_DIR=/opt/omneum/python "$(command -v uv)" sync --project "$GITHUB_WORKSPACE" --locked --no-default-groups --no-editable --managed-python --python 3.13.15
          version=$(python -I -B -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          sudo /usr/bin/python3 -I -B tools/build_linux_runtime.py --version "$version" --output daemon-artifact/runtime.tar.gz
          sudo chown -R "$(id -u):$(id -g)" daemon-artifact
          # Test the shipped, link-free runtime at its final prefix, not the build venv.
          sudo mv /opt/omneum /opt/omneum-build
          sudo /usr/bin/python3 -I -B -c 'import runpy,sys; m=runpy.run_path("omneum/runtime_bundle.py"); m["unpack"](open("daemon-artifact/runtime.tar.gz", "rb"), "/opt/omneum", sys.argv[1])' "$version"
          sudo chmod 755 /opt/omneum
          test ! -L /opt
          sudo chown root:root /opt
          sudo chmod 755 /opt
          # Application verification runs as omneum-mcp during installation,
          # after the installer provisions that identity.
          sudo /usr/bin/python3 -I -B -c 'import runpy; runpy.run_path("deploy/install_server.py")["inspect_runtime"]()'

      - name: Verify fresh Linux public installation
        if: matrix.platform.os == 'linux'
        run: |
          # Leave no pre-provisioned runtime for the public installation helper.
          sudo mv /opt/omneum /opt/omneum-validated
          test ! -L /usr/local/bin
          sudo chown root:root /usr/local/bin
          sudo chmod 755 /usr/local/bin
          version=$(sudo /usr/bin/python3 -I -B -c 'import json; print(json.load(open("/opt/omneum-validated/runtime.json"))["version"])')
          sudo /usr/bin/python3 -I -B daemon-artifact/install-linux.py "$GITHUB_WORKSPACE/daemon-artifact" "$(id -u)" "$version"
          /opt/omneum/.venv/bin/python -I -B tests/security/linux_public_install.py

      - name: Upload daemon artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: daemon-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: daemon-artifact/

  prepare-daemon-release:
    name: Validate wheels and prepare daemon release assets
    needs: [test, build, windows-sdk, source-distribution, linux-foreground, macos-install, daemon-artifacts]
    if: github.event_name != 'pull_request' && github.repository == 'cole-h06/omneum'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate exact release version
        run: |
          # Manual branch runs validate without publishing or creating a tag.
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fi
          python tools/release_daemon.py validate --tag "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Download this run's staged daemon artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for platform in linux-x86_64 macos-aarch64 macos-x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "daemon-$platform" --dir "daemon-artifacts/daemon-$platform"
          done
      - name: Prepare and verify deterministic archives and checksums
        run: python tools/release_daemon.py prepare --tag "$RELEASE_TAG"
      - name: Download this run's wheels and validate the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'wheel-*' --dir wheel-artifacts
          python tools/release_wheels.py prepare --tag "$RELEASE_TAG" \
            --wheels wheel-artifacts --daemon-assets release-assets --output pypi-dist
      - name: Add verified source distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name python-source-distribution --dir source-dist
          python tools/release_sdist.py --sdist "source-dist/omneum-${RELEASE_TAG#v}.tar.gz" --version "${RELEASE_TAG#v}"
          cp source-dist/*.tar.gz pypi-dist/
      - name: Upload validated Python distributions without rebuilding
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-release-wheels
          path: pypi-dist/*
          if-no-files-found: error
      - name: Upload complete release asset set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: daemon-release-assets
          path: release-assets/
          if-no-files-found: error

  prepare-install-assets:
    name: Prepare candidate installer assets independently of SDK matrix
    needs: daemon-artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Prepare exact complete installer asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for platform in linux-x86_64 macos-aarch64 macos-x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "daemon-$platform" --dir "daemon-artifacts/daemon-$platform"
          done
          tag=$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python tools/release_daemon.py prepare --tag "$tag"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: daemon-install-assets
          path: release-assets/
          if-no-files-found: error

  candidate-install-diagnostics:
    name: Fresh candidate installation ${{ matrix.runner }}
    needs: prepare-install-assets
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            wheel: '*cp314*manylinux*x86_64.whl'
          - runner: macos-15
            wheel: '*cp314*arm64.whl'
          - runner: macos-15-intel
            wheel: '*cp314*x86_64.whl'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # This tests a candidate-only prerequisite; the public release gate below
      # still requires the unmodified plain PyPI dependency resolution.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.runner == 'macos-15-intel'
        with:
          python-version: "3.11"
      - name: Build secure unpublished Intel dependency for diagnostics
        if: matrix.runner == 'macos-15-intel'
        run: |
          python -m venv "$RUNNER_TEMP/intel-build"
          "$RUNNER_TEMP/intel-build/bin/python" -m pip install --only-binary=:all: maturin==1.15.0 cffi==2.0.0 setuptools==82.0.1
          "$RUNNER_TEMP/intel-build/bin/python" tools/build_intel_cryptography.py --work "$RUNNER_TEMP/intel-sources" --output "$RUNNER_TEMP/intel-dependency"
          echo "PIP_FIND_LINKS=$RUNNER_TEMP/intel-dependency" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download unpublished candidate distributions and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name daemon-install-assets --dir candidate-assets
      - name: Build this platform's candidate wheel
        run: |
          python -m pip install maturin==1.15.0
          python -m maturin build --locked --release --out candidate-wheels --interpreter python
          python tools/release_wheels.py sanitize --wheels candidate-wheels
      - name: Secure writable hosted Linux runner installation parents
        if: runner.os == 'Linux'
        run: |
          test ! -L /opt
          test ! -L /usr/local/bin
          sudo chown root:root /opt /usr/local/bin
          sudo chmod 755 /opt /usr/local/bin
      - name: Reproduce default Ubuntu prerequisite permissions
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/share"
          chmod 775 "$HOME/.local" "$HOME/.local/share"
      - name: Install wheel in fresh environment and exercise real installer
        env:
          WHEEL_PATTERN: ${{ matrix.wheel }}
        run: |
          python -m venv "$RUNNER_TEMP/fresh-omneum"
          wheel=$(find candidate-wheels -name "$WHEEL_PATTERN")
          test "$(printf '%s\n' "$wheel" | wc -l | tr -d ' ')" = 1
          "$RUNNER_TEMP/fresh-omneum/bin/python" -m pip install --only-binary=:all: "$wheel"
          "$RUNNER_TEMP/fresh-omneum/bin/python" -m pip check
          "$RUNNER_TEMP/fresh-omneum/bin/python" -I tests/security/public_release_install.py candidate-assets

  public-install-acceptance:
    name: Fresh public installation ${{ matrix.runner }}
    needs: prepare-daemon-release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            wheel: '*cp314*manylinux*x86_64.whl'
          - runner: macos-15
            wheel: '*cp314*arm64.whl'
          - runner: macos-15-intel
            wheel: '*cp314*x86_64.whl'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download unpublished candidate distributions and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name daemon-release-assets --dir candidate-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name python-release-wheels --dir candidate-wheels
      - name: Secure writable hosted Linux runner installation parents
        if: runner.os == 'Linux'
        run: |
          test ! -L /opt
          test ! -L /usr/local/bin
          sudo chown root:root /opt /usr/local/bin
          sudo chmod 755 /opt /usr/local/bin
      - name: Install wheel in fresh environment and exercise real installer
        env:
          WHEEL_PATTERN: ${{ matrix.wheel }}
        run: |
          python -m venv "$RUNNER_TEMP/fresh-omneum"
          wheel=$(find candidate-wheels -name "$WHEEL_PATTERN")
          test "$(printf '%s\n' "$wheel" | wc -l | tr -d ' ')" = 1
          "$RUNNER_TEMP/fresh-omneum/bin/python" -m pip install --only-binary=:all: "$wheel"
          "$RUNNER_TEMP/fresh-omneum/bin/python" -m pip check
          "$RUNNER_TEMP/fresh-omneum/bin/python" -I tests/security/public_release_install.py candidate-assets

  publish-daemon-release:
    name: Publish daemon GitHub Release
    environment: github-release
    needs: [prepare-daemon-release, public-install-acceptance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cole-h06/omneum'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    concurrency:
      group: daemon-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Download and verify prepared release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name daemon-release-assets --dir release-assets
          python tools/release_daemon.py verify --tag "$RELEASE_TAG"
      - name: Attest verified daemon asset provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: release-assets/*
      - name: Upload assets to a draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer downloads anonymously from this repository.
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')" = public
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Omneum $RELEASE_TAG" \
            --notes "Versioned native daemon bundles. See deploy/README.md for the artifact and checksum contract." \
            release-assets/*
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir uploaded-assets
          python tools/release_daemon.py verify --tag "$RELEASE_TAG" --output uploaded-assets
          diff -r release-assets uploaded-assets
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-pypi:
    name: Publish validated wheels to PyPI
    needs: publish-daemon-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cole-h06/omneum'
    runs-on: ubuntu-22.04
    # Configure PyPI's Trusted Publisher for cole-h06/omneum, CI.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/omneum/
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: pypi-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Download this run's validated distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name python-release-wheels --dir pypi-dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name daemon-release-assets --dir release-assets
          python tools/release_daemon.py verify --tag "$RELEASE_TAG"
      - name: Require anonymous access to the exact published daemon bytes
        run: |
          mkdir public-release-assets
          for asset in release-assets/*; do
            name=$(basename "$asset")
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 30 --max-time 600 --proto '=https' --proto-redir '=https' \
              "https://github.com/cole-h06/omneum/releases/download/$RELEASE_TAG/$name" \
              --output "public-release-assets/$name"
          done
          diff -r release-assets public-release-assets
          python tools/release_wheels.py verify --tag "$RELEASE_TAG" \
            --wheels pypi-dist --daemon-assets public-release-assets
      - name: Verify source distribution before publication
        run: python tools/release_sdist.py --sdist "pypi-dist/omneum-${RELEASE_TAG#v}.tar.gz" --version "${RELEASE_TAG#v}"
      - name: Publish distributions using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: pypi-dist/
