[package]
name = "omneum_oprf"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "omneum_oprf"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.29"

voprf = { version = "0.5", features = [
    "ristretto255-ciphersuite"
] }

rand = "0.8"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bolero = "0.13.4"

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
