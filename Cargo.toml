[package]
name = "omneum_oprf"
version = "1.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "omneum_oprf"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["dep:pyo3", "pyo3/extension-module"]
daemon = []
# Functional fixtures only; never use this build for protected serving.
test-daemon = ["daemon"]

[[bin]]
name = "omneumd"
path = "src/bin/omneumd.rs"
required-features = ["daemon"]

[[bin]]
name = "omneum-server"
path = "src/bin/omneum-server.rs"
required-features = ["daemon"]

[dependencies]
pyo3 = { version = "0.29", optional = true }

voprf = { version = "0.5", features = [
    "ristretto255-ciphersuite"
] }

rand = "0.8"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bolero = "0.13.4"

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
